<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-density="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - AI 서비스 모음</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-sidebar: #0f0f1a;
            --nav-bg: rgba(10,10,15,0.97);
            --skeleton-base: #1a1a2e;
            --skeleton-shine: rgba(255,255,255,0.06);
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #ffffff;
            --text-muted: #a0a0b8;
            --border: #2a2a3e;
            --nav-h: 64px;
            --side-w: 220px;
            --card-pad: 22px;
            --card-gap: 18px;
            --grid-min: 260px;
        }

        [data-theme="light"] {
            --bg-primary: #f4f4f9;
            --bg-secondary: #eaeaf5;
            --bg-card: #ffffff;
            --bg-sidebar: #ededf8;
            --nav-bg: rgba(244,244,249,0.97);
            --skeleton-base: #e8e8f2;
            --skeleton-shine: rgba(255,255,255,0.6);
            --text: #1a1a2e;
            --text-muted: #6868a8;
            --border: #d8d8ea;
        }

        [data-density="compact"]     { --card-pad: 14px; --card-gap: 10px; --grid-min: 220px; }
        [data-density="comfortable"] { --card-pad: 28px; --card-gap: 24px; --grid-min: 300px; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.25s, color 0.25s;
        }

        /* ── Top Nav ── */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 16px 0 20px;
            z-index: 200; gap: 8px;
        }
        .hamburger {
            display: none; flex-direction: column; justify-content: center;
            gap: 5px; cursor: pointer; padding: 8px; border-radius: 8px;
            transition: background 0.2s; flex-shrink: 0;
        }
        .hamburger:hover { background: rgba(108,99,255,0.12); }
        .hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
        .logo {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #6c63ff, #ff6584);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-right: 16px; white-space: nowrap; letter-spacing: -0.5px; flex-shrink: 0;
        }
        .nav-items { display: flex; gap: 4px; overflow-x: auto; flex: 1; }
        .nav-items::-webkit-scrollbar { display: none; }
        .nav-item {
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            color: var(--text-muted); font-size: 14px; font-weight: 500;
            transition: all 0.2s; white-space: nowrap;
            border: 1px solid transparent; user-select: none;
        }
        .nav-item:hover { color: var(--text); background: rgba(108,99,255,0.1); }
        .nav-item.active { color: var(--text); background: rgba(108,99,255,0.18); border-color: rgba(108,99,255,0.4); }
        .nav-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
        .search-wrap { position: relative; }
        .search-input {
            background: rgba(128,128,128,0.1); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 32px 8px 14px;
            color: var(--text); font-size: 13px; width: 190px; outline: none;
            transition: border-color 0.2s, width 0.2s, background 0.2s;
        }
        .search-input:focus { border-color: rgba(108,99,255,0.5); background: rgba(108,99,255,0.08); width: 250px; }
        .search-input::placeholder { color: var(--text-muted); }
        .search-clear {
            position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: var(--text-muted); font-size: 13px; display: none;
        }
        .search-clear.visible { display: block; }
        .search-clear:hover { color: var(--text); }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(128,128,128,0.1); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; transition: all 0.2s; user-select: none; flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(108,99,255,0.14); border-color: rgba(108,99,255,0.4); }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; top: var(--nav-h); left: 0;
            width: var(--side-w); height: calc(100vh - var(--nav-h));
            background: var(--bg-sidebar); border-right: 1px solid var(--border);
            padding: 20px 10px; overflow-y: auto; z-index: 150;
            transition: transform 0.25s, background 0.25s, border-color 0.25s;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.3); border-radius: 2px; }
        .sidebar-title {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.2px; color: var(--text-muted); padding: 0 10px; margin-bottom: 10px;
        }
        .sidebar-item {
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
            color: var(--text-muted); font-size: 13px; font-weight: 500;
            transition: all 0.18s; margin-bottom: 2px;
            display: flex; align-items: center; gap: 8px; user-select: none;
        }
        .sidebar-item:hover { color: var(--text); background: rgba(108,99,255,0.08); }
        .sidebar-item.active { color: #a89fff; background: rgba(108,99,255,0.14); }
        .sidebar-count {
            margin-left: auto; font-size: 11px;
            background: rgba(128,128,128,0.12); padding: 2px 7px;
            border-radius: 10px; color: var(--text-muted);
        }
        .sidebar-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 140;
        }
        .sidebar-backdrop.visible { display: block; }

        /* ── Main ── */
        .main {
            margin-left: var(--side-w); margin-top: var(--nav-h);
            padding: 32px 28px; min-height: calc(100vh - var(--nav-h));
            transition: margin-left 0.25s;
        }

        /* ── Controls Bar ── */
        .controls-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; flex-wrap: wrap; gap: 10px;
        }
        .section-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
        .section-subtitle { color: var(--text-muted); font-size: 13px; }
        .ctrl-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .ctrl-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .btn-group { display: flex; gap: 3px; }
        .ctrl-btn {
            padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted);
            font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.18s;
        }
        .ctrl-btn:hover { color: var(--text); border-color: rgba(108,99,255,0.4); }
        .ctrl-btn.active { color: #a89fff; border-color: rgba(108,99,255,0.5); background: rgba(108,99,255,0.12); }
        .view-btn {
            width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.18s;
        }
        .view-btn:hover { color: var(--text); border-color: rgba(108,99,255,0.4); }
        .view-btn.active { color: #a89fff; border-color: rgba(108,99,255,0.5); background: rgba(108,99,255,0.12); }

        /* ── Subcategory ── */
        .subcat-section { margin-bottom: 40px; }
        .subcat-label {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
        }
        .subcat-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ── Cards ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
            gap: var(--card-gap);
        }
        .cards-list { display: flex; flex-direction: column; gap: 8px; }
        .cards-list .card { flex-direction: row; align-items: center; padding: 14px 18px; gap: 16px; }
        .cards-list .card-header { flex: 1; min-width: 0; }
        .cards-list .card-desc { display: none; }
        .cards-list .card-footer { flex-shrink: 0; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: var(--card-pad); cursor: pointer;
            transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s, background 0.25s;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 14px;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0; transition: opacity 0.22s;
        }
        .card:hover { border-color: rgba(108,99,255,0.45); transform: translateY(-4px); box-shadow: 0 14px 40px rgba(108,99,255,0.14); }
        .card:hover::before { opacity: 1; }
        .cards-list .card:hover { transform: translateX(4px) translateY(0); }

        .card-header { display: flex; align-items: center; gap: 14px; }
        .card-icon {
            width: 46px; height: 46px; border-radius: 12px;
            background: var(--bg-secondary); display: flex; align-items: center;
            justify-content: center; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border);
        }
        .card-icon img { width: 28px; height: 28px; object-fit: contain; }
        .card-icon-emoji { font-size: 22px; line-height: 1; }
        .card-name { font-size: 15px; font-weight: 700; }
        .card-domain { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.65; flex: 1; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .card-badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }

        .card-tag {
            font-size: 11px; font-weight: 600; padding: 3px 9px;
            border-radius: 20px; border: 1px solid; white-space: nowrap;
        }
        .pricing-badge {
            font-size: 10px; font-weight: 700; padding: 3px 8px;
            border-radius: 20px; border: 1px solid; white-space: nowrap; letter-spacing: 0.3px;
        }
        .card-btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 13px;
            background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.28);
            border-radius: 8px; color: #a89fff; font-size: 12px; font-weight: 600;
            text-decoration: none; transition: all 0.18s; white-space: nowrap;
        }
        .card-btn:hover { background: rgba(108,99,255,0.22); border-color: rgba(108,99,255,0.5); color: #c4bfff; }

        /* Tag colors */
        .tag-assistant { color: #7dd3fc; border-color: rgba(125,211,252,0.3); background: rgba(125,211,252,0.07); }
        .tag-image     { color: #f9a8d4; border-color: rgba(249,168,212,0.3); background: rgba(249,168,212,0.07); }
        .tag-music     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(134,239,172,0.07); }
        .tag-video     { color: #fde68a; border-color: rgba(253,230,138,0.3); background: rgba(253,230,138,0.07); }
        .tag-appbuild  { color: #c4b5fd; border-color: rgba(196,181,253,0.3); background: rgba(196,181,253,0.07); }
        .tag-coding    { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.07); }
        .tag-platform  { color: #fb923c; border-color: rgba(251,146,60,0.3);  background: rgba(251,146,60,0.07); }
        .tag-research  { color: #a5b4fc; border-color: rgba(165,180,252,0.3); background: rgba(165,180,252,0.07); }

        /* Pricing badge colors */
        .price-free     { color: #4ade80; border-color: rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
        .price-freemium { color: #60a5fa; border-color: rgba(96,165,250,0.35); background: rgba(96,165,250,0.08); }
        .price-paid     { color: #f59e0b; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }

        /* ── Modal ── */
        .modal-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.72); z-index: 500;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-backdrop.open { display: flex; }

        .modal {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; width: 100%; max-width: 520px;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5);
            animation: modalIn 0.22s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex; align-items: center; gap: 14px;
            padding: 22px 22px 0;
        }
        .modal-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .modal-icon img { width: 32px; height: 32px; object-fit: contain; }
        .modal-icon-emoji { font-size: 26px; }
        .modal-name { font-size: 18px; font-weight: 800; }
        .modal-domain { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .modal-close {
            margin-left: auto; width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s; flex-shrink: 0;
        }
        .modal-close:hover { color: var(--text); background: rgba(108,99,255,0.1); }

        .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 18px; }

        .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

        .modal-section-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px;
        }
        .modal-features ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }
        .modal-features li {
            font-size: 13px; color: var(--text); padding-left: 16px; position: relative; line-height: 1.5;
        }
        .modal-features li::before {
            content: '▸'; position: absolute; left: 0;
            color: var(--accent); font-size: 11px; top: 2px;
        }

        .modal-pricing-box {
            background: var(--bg-secondary); border-radius: 10px;
            padding: 12px 14px; font-size: 13px; color: var(--text);
            display: flex; align-items: center; gap: 10px;
        }

        .modal-info-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .info-tag {
            font-size: 11px; font-weight: 600; padding: 4px 10px;
            border-radius: 20px; border: 1px solid; white-space: nowrap;
        }
        .info-tag-yes { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.07); }
        .info-tag-no  { color: var(--text-muted); border-color: var(--border); background: transparent; opacity: 0.5; }

        .modal-footer {
            padding: 0 22px 22px;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .modal-visit-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 22px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #9b5de5);
            color: #fff; font-size: 14px; font-weight: 600;
            text-decoration: none; transition: opacity 0.2s;
        }
        .modal-visit-btn:hover { opacity: 0.88; }
        .modal-cancel-btn {
            padding: 10px 18px; border-radius: 10px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); font-size: 14px; cursor: pointer; transition: all 0.18s;
        }
        .modal-cancel-btn:hover { color: var(--text); border-color: rgba(108,99,255,0.4); }

        /* ── Skeleton ── */
        @keyframes shimmer {
            0%   { background-position: -600px 0; }
            100% { background-position: 600px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
            background-size: 1200px 100%; animation: shimmer 1.6s infinite; border-radius: 6px;
        }
        .skeleton-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: var(--card-pad);
            display: flex; flex-direction: column; gap: 14px;
        }
        .sk-row { display: flex; align-items: center; gap: 14px; }
        .sk-icon { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; }
        .sk-title { height: 15px; width: 55%; border-radius: 4px; }
        .sk-domain { height: 11px; width: 38%; border-radius: 4px; margin-top: 6px; }
        .sk-desc { height: 12px; width: 100%; border-radius: 4px; }
        .sk-desc2 { height: 12px; width: 75%; border-radius: 4px; margin-top: 6px; }
        .sk-footer { display: flex; justify-content: space-between; }
        .sk-tag { height: 24px; width: 56px; border-radius: 20px; }
        .sk-btn { height: 30px; width: 76px; border-radius: 8px; }

        /* ── Highlight ── */
        .hl { background: rgba(253,224,71,0.22); color: #fde047; border-radius: 2px; padding: 0 1px; }

        /* ── No Result ── */
        .no-result { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .no-result-icon { font-size: 48px; margin-bottom: 16px; }
        .no-result-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .no-result-sub { font-size: 13px; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.25); border-radius: 3px; }

        /* ── Also In ── */
        .card-alsoin {
            display: flex; gap: 5px; flex-wrap: wrap;
            padding-top: 10px; border-top: 1px solid var(--border);
        }
        .alsoin-badge {
            font-size: 10px; color: var(--text-muted);
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            cursor: pointer; transition: all 0.18s; white-space: nowrap;
        }
        .alsoin-badge:hover { color: #a89fff; border-color: rgba(108,99,255,0.4); background: rgba(108,99,255,0.08); }
        .cards-list .card-alsoin { display: none; }
        .modal-alsoin-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .alsoin-chip {
            font-size: 12px; color: #a89fff;
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: 20px;
            border: 1px solid rgba(108,99,255,0.3); background: rgba(108,99,255,0.08);
            cursor: pointer; transition: all 0.18s; white-space: nowrap;
        }
        .alsoin-chip:hover { background: rgba(108,99,255,0.18); border-color: rgba(108,99,255,0.5); }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-items { display: none; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 20px 14px; }
            .search-input { width: 130px; }
            .search-input:focus { width: 170px; }
            .ctrl-label { display: none; }
        }
    </style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Top Nav -->
<nav class="top-nav">
    <div class="hamburger" id="hamburger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </div>
    <div class="logo">✦ AI Hub</div>
    <div class="nav-items" id="topNav"></div>
    <div class="nav-actions">
        <div class="search-wrap">
            <input class="search-input" id="searchInput" type="text" placeholder="🔍 서비스 검색..." autocomplete="off">
            <span class="search-clear" id="searchClear">✕</span>
        </div>
        <div class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</div>
    </div>
</nav>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar"></aside>

<!-- Main -->
<main class="main" id="main"></main>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
    <div class="modal" id="modal"></div>
</div>

<script>
let DATA = {};
let FLAT_MAP = {};  // name → site 빠른 조회
let curCat = '전체', curSub = '전체';
let searchQuery = '', sortOrder = 'default';
let viewMode = 'grid', density = 'default';
let isDark = true;

/* ── Data load ── */
async function loadData() {
    try {
        const res = await fetch('data.json');
        DATA = await res.json();
    } catch {
        // 로컬 파일 실행 시 fetch 불가 — 빌트인 데이터로 폴백
        DATA = FALLBACK_DATA;
    }
    Object.values(DATA).forEach(subs =>
        Object.values(subs).forEach(arr =>
            arr.forEach(s => { FLAT_MAP[s.name] = s; })
        )
    );
    renderNav(); renderSidebar(); renderMain(true);
}

/* ── Theme ── */
function initTheme() {
    const saved = localStorage.getItem('ai-hub-theme');
    const sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    isDark = (saved || sys) !== 'light';
    applyTheme();
}
function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}
function toggleTheme() {
    isDark = !isDark;
    localStorage.setItem('ai-hub-theme', isDark ? 'dark' : 'light');
    applyTheme();
}

/* ── Density ── */
function initDensity() {
    density = localStorage.getItem('ai-hub-density') || 'default';
    document.documentElement.setAttribute('data-density', density);
}
function setDensity(d) {
    density = d;
    document.documentElement.setAttribute('data-density', d);
    localStorage.setItem('ai-hub-density', d);
    renderMain();
}

/* ── Sidebar ── */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('visible');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('visible');
}
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

/* ── Helpers ── */
function sitesFor(cat, sub) {
    if (cat === '전체') {
        const flat = {};
        Object.entries(DATA).forEach(([, subs]) =>
            Object.entries(subs).forEach(([s, arr]) => {
                if (!flat[s]) flat[s] = [];
                flat[s].push(...arr);
            })
        );
        return sub === '전체' ? flat : { [sub]: flat[sub] || [] };
    }
    const subs = DATA[cat] || {};
    return sub === '전체' ? subs : { [sub]: subs[sub] || [] };
}
function subcatsFor(cat) {
    if (cat === '전체') return Object.values(DATA).flatMap(s => Object.keys(s));
    return Object.keys(DATA[cat] || {});
}
function countFor(cat, sub) {
    return Object.values(sitesFor(cat, sub)).reduce((a, b) => a + b.length, 0);
}
function applyFilter(sites) {
    let r = [...sites];
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        r = r.filter(s =>
            s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) ||
            s.domain.toLowerCase().includes(q) || s.label.toLowerCase().includes(q)
        );
    }
    if (sortOrder === 'name-asc')  r.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    if (sortOrder === 'name-desc') r.sort((a, b) => b.name.localeCompare(a.name, 'ko'));
    return r;
}
function hl(text, q) {
    if (!q) return text;
    const e = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${e})`, 'gi'), '<span class="hl">$1</span>');
}
function pricingLabel(p) {
    return { free: 'Free', freemium: 'Freemium', paid: 'Paid' }[p] || p;
}

/* ── Skeleton ── */
function skeletonCard() {
    return `<div class="skeleton-card">
        <div class="sk-row"><div class="skeleton sk-icon"></div>
            <div style="flex:1"><div class="skeleton sk-title"></div><div class="skeleton sk-domain"></div></div></div>
        <div><div class="skeleton sk-desc"></div><div class="skeleton sk-desc2"></div></div>
        <div class="sk-footer"><div class="skeleton sk-tag"></div><div class="skeleton sk-btn"></div></div>
    </div>`;
}
function showSkeleton() {
    document.getElementById('main').innerHTML =
        `<div class="controls-bar" style="opacity:.4;pointer-events:none">
            <div><div class="skeleton" style="height:24px;width:180px;border-radius:6px"></div>
                 <div class="skeleton" style="height:13px;width:90px;border-radius:4px;margin-top:6px"></div></div>
         </div>
         <div class="subcat-section"><div class="cards-grid">${skeletonCard().repeat(6)}</div></div>`;
}

/* ── Render Nav ── */
function renderNav() {
    const cats = ['전체', ...Object.keys(DATA)];
    document.getElementById('topNav').innerHTML = cats.map(c =>
        `<div class="nav-item ${c === curCat ? 'active' : ''}" onclick="selectCat('${c}')">${c}</div>`
    ).join('');
}

/* ── Render Sidebar ── */
function renderSidebar() {
    const subs = subcatsFor(curCat);
    const total = countFor(curCat, '전체');
    let html = `<div class="sidebar-title">카테고리</div>`;
    html += `<div class="sidebar-item ${curSub === '전체' ? 'active' : ''}" onclick="selectSub('전체')">
        <span>전체 보기</span><span class="sidebar-count">${total}</span></div>`;
    subs.forEach(s => {
        const n = countFor(curCat, s);
        html += `<div class="sidebar-item ${curSub === s ? 'active' : ''}" onclick="selectSub('${s}')">
            <span>${s}</span><span class="sidebar-count">${n}</span></div>`;
    });
    document.getElementById('sidebar').innerHTML = html;
}

/* ── Render Main ── */
function renderMain(withSkeleton = false) {
    if (withSkeleton) { showSkeleton(); setTimeout(_renderMain, 200); }
    else _renderMain();
}
function _renderMain() {
    let baseMap;
    if (searchQuery) {
        baseMap = {};
        Object.entries(DATA).forEach(([, subs]) =>
            Object.entries(subs).forEach(([s, arr]) => {
                if (!baseMap[s]) baseMap[s] = [];
                baseMap[s].push(...arr);
            })
        );
    } else {
        baseMap = sitesFor(curCat, curSub);
    }
    const filtered = {};
    Object.entries(baseMap).forEach(([sub, sites]) => {
        const r = applyFilter(sites);
        if (r.length) filtered[sub] = r;
    });
    const total = Object.values(filtered).reduce((a, b) => a + b.length, 0);
    const titleText = searchQuery ? `"${searchQuery}" 검색 결과`
        : curCat === '전체' ? '모든 AI 서비스' : curCat;
    const sortLabels = { default: '기본순', 'name-asc': '이름 ↑', 'name-desc': '이름 ↓' };
    const densityLabels = { compact: '좁게', default: '기본', comfortable: '넓게' };
    const gridClass = viewMode === 'list' ? 'cards-list' : 'cards-grid';

    let html = `
        <div class="controls-bar">
            <div>
                <div class="section-title">${titleText}</div>
                <div class="section-subtitle">${total}개의 서비스${!searchQuery && curSub !== '전체' ? ' · ' + curSub : ''}</div>
            </div>
            <div class="ctrl-group">
                <span class="ctrl-label">밀도</span>
                <div class="btn-group">
                    ${['compact','default','comfortable'].map(d =>
                        `<button class="ctrl-btn ${density === d ? 'active' : ''}" onclick="setDensity('${d}')">${densityLabels[d]}</button>`
                    ).join('')}
                </div>
                <span class="ctrl-label" style="margin-left:4px">보기</span>
                <div class="btn-group">
                    <button class="view-btn ${viewMode === 'grid' ? 'active' : ''}" onclick="setView('grid')" title="그리드">⊞</button>
                    <button class="view-btn ${viewMode === 'list' ? 'active' : ''}" onclick="setView('list')" title="리스트">≡</button>
                </div>
                <span class="ctrl-label" style="margin-left:4px">정렬</span>
                <div class="btn-group">
                    ${['default','name-asc','name-desc'].map(k =>
                        `<button class="ctrl-btn ${sortOrder === k ? 'active' : ''}" onclick="setSort('${k}')">${sortLabels[k]}</button>`
                    ).join('')}
                </div>
            </div>
        </div>`;

    if (total === 0) {
        html += `<div class="no-result">
            <div class="no-result-icon">🔍</div>
            <div class="no-result-title">검색 결과가 없습니다</div>
            <div class="no-result-sub">"${searchQuery}"에 대한 서비스를 찾지 못했습니다</div>
        </div>`;
    } else {
        Object.entries(filtered).forEach(([subcat, sites]) => {
            html += `<div class="subcat-section">
                <div class="subcat-label">${subcat}</div>
                <div class="${gridClass}">${sites.map(s => cardHTML(s, searchQuery)).join('')}</div>
            </div>`;
        });
    }
    document.getElementById('main').innerHTML = html;
}

function cardHTML(s, q = '') {
    const pLabel = pricingLabel(s.pricing);
    return `
        <div class="card" onclick="openModal('${s.name.replace(/'/g, "\\'")}')">
            <div class="card-header">
                <div class="card-icon">
                    <img src="https://www.google.com/s2/favicons?domain=${s.domain}&sz=64"
                         alt="${s.name}"
                         onerror="this.outerHTML='<span class=card-icon-emoji>${s.emoji}</span>'">
                </div>
                <div>
                    <div class="card-name">${hl(s.name, q)}</div>
                    <div class="card-domain">${hl(s.domain, q)}</div>
                </div>
            </div>
            <div class="card-desc">${hl(s.desc, q)}</div>
            <div class="card-footer">
                <div class="card-badges">
                    <span class="card-tag tag-${s.tag}">${s.label}</span>
                    <span class="pricing-badge price-${s.pricing}">${pLabel}</span>
                </div>
                <a class="card-btn" href="${s.url}" target="_blank" onclick="event.stopPropagation()">방문하기 →</a>
            </div>
            ${s.alsoIn && s.alsoIn.length ? `
            <div class="card-alsoin">
                ${s.alsoIn.map(a => `<span class="alsoin-badge" onclick="navigateToAlsoIn('${a}', event)">🔗 ${a}</span>`).join('')}
            </div>` : ''}
        </div>`;
}

/* ── Modal ── */
function openModal(name) {
    const s = FLAT_MAP[name];
    if (!s) return;
    const infoTags = [
        { label: '한국어 지원', val: s.korean },
        { label: 'API 제공',   val: s.api },
        { label: '모바일 앱',  val: s.mobileApp },
    ];
    document.getElementById('modal').innerHTML = `
        <div class="modal-header">
            <div class="modal-icon">
                <img src="https://www.google.com/s2/favicons?domain=${s.domain}&sz=64"
                     alt="${s.name}"
                     onerror="this.outerHTML='<span class=modal-icon-emoji>${s.emoji}</span>'">
            </div>
            <div>
                <div class="modal-name">${s.name}</div>
                <div class="modal-domain">${s.domain}</div>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc">${s.desc}</p>
            <div class="modal-features">
                <div class="modal-section-title">주요 기능</div>
                <ul>${(s.features || []).map(f => `<li>${f}</li>`).join('')}</ul>
            </div>
            <div>
                <div class="modal-section-title">요금제</div>
                <div class="modal-pricing-box">
                    <span class="pricing-badge price-${s.pricing}">${pricingLabel(s.pricing)}</span>
                    <span style="font-size:13px;color:var(--text-muted)">${s.pricingNote || ''}</span>
                </div>
            </div>
            <div>
                <div class="modal-section-title">지원 정보</div>
                <div class="modal-info-tags">
                    ${infoTags.map(t =>
                        `<span class="info-tag ${t.val ? 'info-tag-yes' : 'info-tag-no'}">${t.val ? '✓' : '✗'} ${t.label}</span>`
                    ).join('')}
                </div>
            </div>
            ${s.alsoIn && s.alsoIn.length ? `
            <div>
                <div class="modal-section-title">다른 카테고리에서도 볼 수 있어요</div>
                <div class="modal-alsoin-tags">
                    ${s.alsoIn.map(a => `<span class="alsoin-chip" onclick="navigateAndClose('${a}')">📌 ${a} →</span>`).join('')}
                </div>
            </div>` : ''}
        </div>
        <div class="modal-footer">
            <button class="modal-cancel-btn" onclick="closeModal()">닫기</button>
            <a class="modal-visit-btn" href="${s.url}" target="_blank">방문하기 →</a>
        </div>`;
    document.getElementById('modalBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
}
function handleBackdropClick(e) {
    if (e.target === document.getElementById('modalBackdrop')) closeModal();
}
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (document.getElementById('modalBackdrop').classList.contains('open')) { closeModal(); return; }
        if (searchQuery) {
            searchInput.value = ''; searchQuery = '';
            searchClear.classList.remove('visible');
            renderSidebar(); renderMain();
        }
    }
    if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
});

/* ── Also In Navigation ── */
function navigateToAlsoIn(alsoInStr, event) {
    event.stopPropagation();
    const parts = alsoInStr.split(' > ');
    curCat = parts[0].trim();
    curSub = parts[1] ? parts[1].trim() : '전체';
    renderNav(); renderSidebar(); renderMain(true);
}
function navigateAndClose(alsoInStr) {
    closeModal();
    const parts = alsoInStr.split(' > ');
    curCat = parts[0].trim();
    curSub = parts[1] ? parts[1].trim() : '전체';
    renderNav(); renderSidebar(); renderMain(true);
}

/* ── Events ── */
function selectCat(c) { curCat = c; curSub = '전체'; closeSidebar(); renderNav(); renderSidebar(); renderMain(true); }
function selectSub(s) { curSub = s; closeSidebar(); renderSidebar(); renderMain(true); }
function setSort(o)   { sortOrder = o; renderMain(); }
function setView(v)   { viewMode  = v; renderMain(); }

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    searchClear.classList.toggle('visible', searchQuery.length > 0);
    renderSidebar(); renderMain();
});
searchClear.addEventListener('click', () => {
    searchInput.value = ''; searchQuery = '';
    searchClear.classList.remove('visible');
    renderSidebar(); renderMain(); searchInput.focus();
});

/* ── Init ── */
initTheme();
initDensity();
loadData();
</script>
</body>
</html>
