<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - AI 서비스 모음</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-sidebar: #0f0f1a;
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #ffffff;
            --text-muted: #a0a0b8;
            --border: #2a2a3e;
            --nav-h: 64px;
            --side-w: 220px;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Top Nav ── */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: rgba(10,10,15,0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 200;
            gap: 8px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #6c63ff, #ff6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 20px;
            white-space: nowrap;
            letter-spacing: -0.5px;
        }

        .nav-items { display: flex; gap: 4px; overflow-x: auto; }
        .nav-items::-webkit-scrollbar { display: none; }

        .nav-item {
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            border: 1px solid transparent;
            user-select: none;
        }
        .nav-item:hover { color: var(--text); background: rgba(108,99,255,0.1); }
        .nav-item.active {
            color: var(--text);
            background: rgba(108,99,255,0.18);
            border-color: rgba(108,99,255,0.4);
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: var(--nav-h); left: 0;
            width: var(--side-w);
            height: calc(100vh - var(--nav-h));
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 20px 10px;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.3); border-radius: 2px; }

        .sidebar-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .sidebar-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.18s;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .sidebar-item:hover { color: var(--text); background: rgba(108,99,255,0.08); }
        .sidebar-item.active { color: #a89fff; background: rgba(108,99,255,0.14); }

        .sidebar-count {
            margin-left: auto;
            font-size: 11px;
            background: rgba(255,255,255,0.06);
            padding: 2px 7px;
            border-radius: 10px;
            color: var(--text-muted);
        }

        /* ── Main ── */
        .main {
            margin-left: var(--side-w);
            margin-top: var(--nav-h);
            padding: 36px 32px;
            min-height: calc(100vh - var(--nav-h));
        }

        .section-header { margin-bottom: 28px; }

        .section-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }

        .section-subtitle { color: var(--text-muted); font-size: 14px; }

        /* ── Subcategory group ── */
        .subcat-section { margin-bottom: 44px; }

        .subcat-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subcat-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Cards Grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            cursor: pointer;
            transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.22s;
        }
        .card:hover {
            border-color: rgba(108,99,255,0.45);
            transform: translateY(-5px);
            box-shadow: 0 16px 44px rgba(108,99,255,0.16);
        }
        .card:hover::before { opacity: 1; }

        .card-header { display: flex; align-items: center; gap: 14px; }

        .card-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .card-icon img { width: 30px; height: 30px; object-fit: contain; }
        .card-icon-emoji { font-size: 24px; line-height: 1; }

        .card-name { font-size: 16px; font-weight: 700; }
        .card-domain { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

        .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.65; flex: 1; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; }

        .card-tag {
            font-size: 11px; font-weight: 600;
            padding: 3px 10px; border-radius: 20px; border: 1px solid;
        }

        .card-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 14px;
            background: rgba(108,99,255,0.12);
            border: 1px solid rgba(108,99,255,0.28);
            border-radius: 8px;
            color: #a89fff;
            font-size: 12px; font-weight: 600;
            text-decoration: none;
            transition: all 0.18s;
        }
        .card-btn:hover {
            background: rgba(108,99,255,0.24);
            border-color: rgba(108,99,255,0.5);
            color: #c4bfff;
        }

        /* Tag colors */
        .tag-assistant { color: #7dd3fc; border-color: rgba(125,211,252,0.3); background: rgba(125,211,252,0.07); }
        .tag-image     { color: #f9a8d4; border-color: rgba(249,168,212,0.3); background: rgba(249,168,212,0.07); }
        .tag-music     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(134,239,172,0.07); }
        .tag-video     { color: #fde68a; border-color: rgba(253,230,138,0.3); background: rgba(253,230,138,0.07); }
        .tag-appbuild  { color: #c4b5fd; border-color: rgba(196,181,253,0.3); background: rgba(196,181,253,0.07); }
        .tag-coding    { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.07); }
        .tag-platform  { color: #fb923c; border-color: rgba(251,146,60,0.3);  background: rgba(251,146,60,0.07); }
        .tag-research  { color: #a5b4fc; border-color: rgba(165,180,252,0.3); background: rgba(165,180,252,0.07); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.25); border-radius: 3px; }

        /* ── Search ── */
        .search-wrap { margin-left: auto; position: relative; }
        .search-input {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 34px 8px 14px;
            color: var(--text);
            font-size: 13px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s, width 0.2s, background 0.2s;
        }
        .search-input:focus {
            border-color: rgba(108,99,255,0.5);
            background: rgba(108,99,255,0.08);
            width: 260px;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-clear {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1;
            display: none;
        }
        .search-clear.visible { display: block; }
        .search-clear:hover { color: var(--text); }

        /* ── Controls Bar ── */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sort-wrap { display: flex; align-items: center; gap: 8px; }
        .sort-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
        .sort-btns { display: flex; gap: 4px; }
        .sort-btn {
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
        }
        .sort-btn:hover { color: var(--text); border-color: rgba(108,99,255,0.4); }
        .sort-btn.active {
            color: #a89fff;
            border-color: rgba(108,99,255,0.5);
            background: rgba(108,99,255,0.12);
        }

        /* ── Highlight ── */
        .hl { background: rgba(253,224,71,0.25); color: #fde047; border-radius: 2px; padding: 0 1px; }

        /* ── No Result ── */
        .no-result {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .no-result-icon { font-size: 48px; margin-bottom: 16px; }
        .no-result-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .no-result-sub { font-size: 13px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px 16px; }
            .search-input { width: 140px; }
            .search-input:focus { width: 180px; }
        }
    </style>
</head>
<body>

<!-- Top Nav -->
<nav class="top-nav">
    <div class="logo">✦ AI Hub</div>

const CATEGORIES = ['전체', ...Object.keys(DATA)];
let curCat = '전체';
let curSub = '전체';
let searchQuery = '';
let sortOrder = 'default'; // 'default' | 'name-asc' | 'name-desc'

/* ── Helpers ── */
function allSites() {
    return Object.values(DATA).flatMap(subs => Object.values(subs).flat());
}

function sitesFor(cat, sub) {
    if (cat === '전체') {
        const flat = {};
        Object.entries(DATA).forEach(([, subs]) =>
            Object.entries(subs).forEach(([s, arr]) => {
                if (!flat[s]) flat[s] = [];
                flat[s].push(...arr);
            })
        );
        if (sub === '전체') return flat;
        return { [sub]: flat[sub] || [] };
    }
    const subs = DATA[cat] || {};
    if (sub === '전체') return subs;
    return { [sub]: subs[sub] || [] };
}

function subcatsFor(cat) {
    if (cat === '전체') {
        return Object.values(DATA).flatMap(subs => Object.keys(subs));
    }
    return Object.keys(DATA[cat] || {});
}

function countFor(cat, sub) {
    const map = sitesFor(cat, sub);
    return Object.values(map).reduce((a, b) => a + b.length, 0);
}

/* ── Render Top Nav ── */
function renderNav() {
    document.getElementById('topNav').innerHTML = CATEGORIES.map(c => `
        <div class="nav-item ${c === curCat ? 'active' : ''}" onclick="selectCat('${c}')">${c}</div>
    `).join('');
}

/* ── Render Sidebar ── */
function renderSidebar() {
    const subs = subcatsFor(curCat);
    const total = countFor(curCat, '전체');
    let html = `<div class="sidebar-title">소 카테고리</div>`;
    html += `<div class="sidebar-item ${curSub === '전체' ? 'active' : ''}" onclick="selectSub('전체')">
        <span>전체 보기</span><span class="sidebar-count">${total}</span>
    </div>`;
    subs.forEach(s => {
        const n = countFor(curCat, s);
        html += `<div class="sidebar-item ${curSub === s ? 'active' : ''}" onclick="selectSub('${s}')">
            <span>${s}</span><span class="sidebar-count">${n}</span>
        </div>`;
    });
    document.getElementById('sidebar').innerHTML = html;
}

/* ── Highlight ── */
function hl(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="hl">$1</span>');
}

/* ── Sort sites ── */
function applySortAndFilter(sites) {
    let result = [...sites];
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        result = result.filter(s =>
            s.name.toLowerCase().includes(q) ||
            s.desc.toLowerCase().includes(q) ||
            s.domain.toLowerCase().includes(q) ||
            s.label.toLowerCase().includes(q)
        );
    }
    if (sortOrder === 'name-asc')  result.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    if (sortOrder === 'name-desc') result.sort((a, b) => b.name.localeCompare(a.name, 'ko'));
    return result;
}

/* ── Render Main ── */
function renderMain() {
    // 검색 중에는 전체 데이터에서 탐색
    let map;
    if (searchQuery) {
        const flat = {};
        Object.entries(DATA).forEach(([, subs]) =>
            Object.entries(subs).forEach(([s, arr]) => {
                if (!flat[s]) flat[s] = [];
                flat[s].push(...arr);
            })
        );
        map = flat;
    } else {
        map = sitesFor(curCat, curSub);
    }

    // 검색 + 정렬 적용
    const filtered = {};
    Object.entries(map).forEach(([subcat, sites]) => {
        const result = applySortAndFilter(sites);
        if (result.length) filtered[subcat] = result;
    });

    const total = Object.values(filtered).reduce((a, b) => a + b.length, 0);
    const titleText = searchQuery
        ? `"${searchQuery}" 검색 결과`
        : curCat === '전체' ? '모든 AI 서비스' : curCat;

    const sortLabels = { default: '기본순', 'name-asc': '이름 ↑', 'name-desc': '이름 ↓' };

    let html = `
        <div class="controls-bar">
            <div class="section-header" style="margin-bottom:0">
                <div class="section-title">${titleText}</div>
                <div class="section-subtitle">${total}개의 서비스${!searchQuery && curSub !== '전체' ? ' · ' + curSub : ''}</div>
            </div>
            <div class="sort-wrap">
                <span class="sort-label">정렬</span>
                <div class="sort-btns">
                    ${['default','name-asc','name-desc'].map(k => `
                        <button class="sort-btn ${sortOrder === k ? 'active' : ''}" onclick="setSort('${k}')">${sortLabels[k]}</button>
                    `).join('')}
                </div>
            </div>
        </div>
    `;

    if (total === 0) {
        html += `<div class="no-result">
            <div class="no-result-icon">🔍</div>
            <div class="no-result-title">검색 결과가 없습니다</div>
            <div class="no-result-sub">"${searchQuery}"에 대한 서비스를 찾지 못했습니다</div>
        </div>`;
    } else {
        Object.entries(filtered).forEach(([subcat, sites]) => {
            html += `<div class="subcat-section">
                <div class="subcat-label">${subcat}</div>
                <div class="cards-grid">${sites.map(s => cardHTML(s, searchQuery)).join('')}</div>
            </div>`;
        });
    }

    document.getElementById('main').innerHTML = html;
}

function cardHTML(s, query = '') {
    return `
        <div class="card" onclick="window.open('${s.url}','_blank')">
            <div class="card-header">
                <div class="card-icon">
                    <img src="https://www.google.com/s2/favicons?domain=${s.domain}&sz=64"
                         alt="${s.name}"
                         onerror="this.outerHTML='<span class=card-icon-emoji>${s.emoji}</span>'">
                </div>
                <div>
                    <div class="card-name">${hl(s.name, query)}</div>
                    <div class="card-domain">${hl(s.domain, query)}</div>
                </div>
            </div>
            <div class="card-desc">${hl(s.desc, query)}</div>
            <div class="card-footer">
                <span class="card-tag tag-${s.tag}">${s.label}</span>
                <a class="card-btn" href="${s.url}" target="_blank" onclick="event.stopPropagation()">방문하기 →</a>
            </div>
        </div>`;
}

/* ── Events ── */
function selectCat(c) {
    curCat = c;
    curSub = '전체';
    renderNav();
    renderSidebar();
    renderMain();
}

function selectSub(s) {
    curSub = s;
    renderSidebar();
    renderMain();
}

function setSort(order) {
    sortOrder = order;
    renderMain();
}

/* ── Search Events ── */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    searchClear.classList.toggle('visible', searchQuery.length > 0);
    renderSidebar();
    renderMain();
});

searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('visible');
    renderSidebar();
    renderMain();
    searchInput.focus();
});

document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
    }
    if (e.key === 'Escape' && searchQuery) {
        searchInput.value = '';
        searchQuery = '';
        searchClear.classList.remove('visible');
        renderSidebar();
        renderMain();
    }
});

/* ── Init ── */
renderNav();
renderSidebar();
renderMain();
</script>
</body>
</html>
